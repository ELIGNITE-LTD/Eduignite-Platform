appId: online.eduignite.offline
productName: EduIgnite Offline
copyright: EduIgnite

directories:
  output: release
  buildResources: build

# Renderer (dist/) + main/preload (dist-electron/) are produced by `vite build`
# (see package.json "build" script). better-sqlite3-multiple-ciphers ships a
# native .node binary that must NOT be packed into the asar — electron-builder
# unpacks node_modules containing native bindings automatically via this glob.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# electron/main.ts resolves these two at runtime via `process.resourcesPath`
# in a packaged build (see userDataPaths()) — without extraResources they
# would 404/ENOENT the first time a migration or a license certificate needs
# checking, since neither is bundled into dist-electron/main.js by Vite.
extraResources:
  - from: src/db/migrations
    to: migrations
  - from: src/licensing/public-key.pem
    to: public-key.pem

asarUnpack:
  - "**/node_modules/better-sqlite3-multiple-ciphers/**/*"

asar: true
compression: normal

# In-app auto-update feed (electron-updater's `generic` HTTP provider).
#
# electron-builder bakes this into an `app-update.yml` file inside the
# packaged app's resources at build time; electron-updater's
# autoUpdater.checkForUpdates() (see electron/autoUpdate.ts) reads that
# bundled config automatically -- no setFeedURL() call needed at runtime.
#
# NOT electron-updater's built-in `github` provider: ELIGNITE-LTD/Eduignite-Platform
# is a private repo, and the `github` provider would require either making it
# public or embedding a repo-read GitHub token inside every distributed copy
# of this app -- both unacceptable. `generic` instead points at a
# `downloads/updates/offline-desktop/` prefix on the app's own existing,
# already-public, unauthenticated download host (see
# .github/workflows/offline-desktop.yml's "Publish installer to the download
# host" step, which this feature extends to also upload `latest.yml` + the
# versioned installer there).
#
# The "/offline-desktop/" segment is load-bearing, not cosmetic:
# apps/desktop publishes its OWN latest.yml for a DIFFERENT application to
# this same downloads/updates/ host. Both apps originally published
# straight to downloads/updates/latest.yml with no per-app segment --
# confirmed live that this is a real collision (whichever app deployed most
# recently silently overwrote the other's feed file), which would have
# made the OTHER app's electron-updater try to download and install a
# completely different EduIgnite application. Each app now gets its own
# subdirectory.
#
# The existing unversioned `downloads/eduignite-offline-setup.exe` (the
# website's "download" button, for fresh installs) is untouched and keeps
# working exactly as before.
publish:
  provider: generic
  url: https://eduignite.online/downloads/updates/offline-desktop/
  channel: latest

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: EduIgnite-Offline-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EduIgnite Offline
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Education
  artifactName: EduIgnite-Offline-${version}.${ext}
