# EduIgnite frontend (Next.js) — self-hosted production.
# Built on the server and served by `next start` on localhost:3000; Caddy
# reverse-proxies eduignite.online -> this, with Cloudflare in front.
#
#   docker compose -f docker-compose.frontend.yml up -d --build

services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: "https://api.eduignite.online/api/v1"
        NEXT_PUBLIC_APP_URL: "https://eduignite.online"
        NEXT_PUBLIC_APP_NAME: "EduIgnite"
    image: eduignite-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
