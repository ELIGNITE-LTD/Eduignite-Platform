name: Deploy backend (VPS)

# Auto-deploy the Django backend to the self-hosted Contabo VPS on every push
# to main that touches backend code. The server already holds the secrets
# (/opt/eduignite/backend/.env, chmod 600) — this never ships or overwrites
# them. Migrations + collectstatic run automatically from the web container's
# entrypoint on boot, so deploying is: sync code -> rebuild -> restart.
#
# Required repo config (Settings > Secrets and variables > Actions):
#   secret  VPS_SSH_KEY  — private key authorized on the VPS (CI deploy key)
#   var     VPS_HOST     — e.g. 169.58.48.112
#   var     VPS_USER     — e.g. root

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Back up the database before changing anything
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes             "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}"             'bash /opt/eduignite/backup.sh'

      - name: Sync backend code to the VPS
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            backend/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/eduignite/backend/"

      - name: Rebuild & restart the backend stack
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'bash /opt/eduignite/deploy-backend.sh'

      - name: Check web, worker and beat are running
        run: |
          sleep 30
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes             "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" '
              fail=0
              for c in backend-web-1 backend-worker-1 backend-beat-1; do
                running=$(docker inspect -f "{{.State.Running}} {{.RestartCount}}" "$c" 2>/dev/null || echo "missing")
                echo "$c: $running"
                case "$running" in "true 0") ;; *) fail=1 ;; esac
              done
              exit $fail'
