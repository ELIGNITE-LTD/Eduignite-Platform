name: Backend checks

# Guards the class of failure that took production down on 2026-11-09: two
# migrations with the same number made `manage.py migrate` abort at deploy time.
# Every one of these checks runs BEFORE merge, so a bad migration graph is
# caught on the pull request instead of on the server.
#
# Make the job "Migrations & boot" a required status check on main
# (Settings > Branches > branch protection) so it cannot be merged red.
#
# Runs on every PR and push to main that touches the backend. The deploy
# workflow only fires on the same paths, so nothing deploys unchecked.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    name: Migrations & boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: eduignite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduignite_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      # Throwaway values only: this database lives and dies with the job.
      DJANGO_SECRET_KEY: ci-dummy-secret-key-not-for-prod-0123456789abcdef0123456789
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_NAME: eduignite_ci
      DB_USER: postgres
      DB_PASSWORD: ci-throwaway
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_SSLMODE: disable
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter as backend/Dockerfile (python:3.11-slim-bookworm).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0

      # production.txt is exactly what the Docker image installs.
      - name: Install production requirements
        run: pip install -r requirements/production.txt

      # Fails on two leaf migrations in one app ("Conflicting migrations
      # detected") and on model changes that have no migration.
      - name: Migration graph is single-headed and complete
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Django system check with production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: localhost
        run: python manage.py check

      # Applies every migration from an empty database, the way a fresh
      # environment (or a disaster restore) would.
      - name: Apply all migrations to an empty database
        run: python manage.py migrate --noinput

      - name: Nothing left to migrate
        run: |
          python manage.py migrate --check
          python manage.py showmigrations --plan | tail -n 5

      - name: Import and boot smoke test
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.urls import get_resolver
          from django.test import Client
          get_resolver().url_patterns  # every urls.py imports cleanly
          r = Client().get('/api/v1/health/')
          assert r.status_code == 200 and r.json() == {'status': 'ok'}, r.content
          print('boot smoke test passed')
          PY

      - name: Health endpoint tests
        run: python -m pytest core/tests/test_health.py -p no:cacheprovider --no-cov -q
