name: Build mobile app

# Monorepo: only rebuild the Android app when the mobile app (or this workflow)
# changes, so a website or backend commit never triggers an APK build.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NEXT_PUBLIC_API_URL: https://api.eduignite.online/api/v1
  NEXT_PUBLIC_APP_URL: https://eduignite.online
  AWS_REGION: us-east-1
  DOWNLOADS_BUCKET: eduignite-prod-media-4e04d3e3
  APP_NAME_TAG: eduignite-prod-app

# Every `run` step executes inside the mobile app package.
defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js static export
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install Firebase Android config (FCM push)
        run: cp resources/google-services.json android/app/google-services.json

      - name: Add storage permissions to Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # @capacitor/filesystem writes to Documents/eduignite and requires these
          # permissions to be declared, or it throws at runtime. maxSdkVersion keeps
          # them scoped to the legacy Android versions that actually need them.
          if ! grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' "$MANIFEST"
          fi
          # Let writes to the public Documents folder work on Android 10.
          sed -i 's#<application #<application android:requestLegacyExternalStorage="true" #' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Generate app icons (shield logo)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1E3A5F' --iconBackgroundColorDark '#1E3A5F' || echo "icon generation skipped"

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/eduignite-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configure release signing
        run: python3 scripts/patch-release-signing.py android/app/build.gradle

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/eduignite-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk eduignite-mobile.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.${{ github.run_number }}
          name: EduIgnite Mobile v1.0.${{ github.run_number }}
          files: apps/mobile/eduignite-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish APK to the download host (S3 + box sync)
        working-directory: apps/mobile
        run: |
          aws s3 cp eduignite-mobile.apk "s3://$DOWNLOADS_BUCKET/downloads/eduignite-mobile.apk" --region "$AWS_REGION"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$APP_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Syncing installers on $INSTANCE_ID"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync installers" \
            --parameters commands="aws s3 sync s3://$DOWNLOADS_BUCKET/downloads/ /opt/eduignite/downloads/ --region $AWS_REGION" \
            --region "$AWS_REGION"
