name: Build mobile app

# Monorepo: only rebuild the Android app when the mobile app (or this workflow)
# changes, so a website or backend commit never triggers an APK build.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NEXT_PUBLIC_API_URL: https://api.eduignite.online/api/v1
  NEXT_PUBLIC_APP_URL: https://eduignite.online
  # Baked into the build so the app can compare its own version against the
  # platform's app-versions endpoint (see src/lib/app-version.ts). Kept in
  # sync with the tag/release name below.
  NEXT_PUBLIC_APP_VERSION: 1.0.${{ github.run_number }}

# Every `run` step executes inside the mobile app package.
defaults:
  run:
    working-directory: apps/mobile

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js static export
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install Firebase Android config (FCM push)
        run: cp resources/google-services.json android/app/google-services.json

      - name: Add storage permissions to Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # @capacitor/filesystem writes to Documents/eduignite and requires these
          # permissions to be declared, or it throws at runtime. maxSdkVersion keeps
          # them scoped to the legacy Android versions that actually need them.
          if ! grep -q 'WRITE_EXTERNAL_STORAGE' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' "$MANIFEST"
          fi
          # Let writes to the public Documents folder work on Android 10.
          sed -i 's#<application #<application android:requestLegacyExternalStorage="true" #' "$MANIFEST"
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      # Lets the in-app update flow (packages/capacitor-apk-installer, wired
      # up in src/components/layout/android-update-dialog.tsx) hand a
      # downloaded APK to the system package installer. REQUEST_INSTALL_PACKAGES
      # is a normal permission (granted at install time on Android 8+, no
      # runtime prompt) but the OS separately still requires a one-time
      # "allow installs from this app" toggle the user must flip themselves
      # -- ApkInstallerPlugin.canInstall()/openInstallPermissionSettings()
      # handle routing the user to that settings screen from the JS side.
      - name: Add APK-install permission + FileProvider to Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          XML_DIR=android/app/src/main/res/xml
          mkdir -p "$XML_DIR"
          cp resources/apk_installer_file_paths.xml "$XML_DIR/apk_installer_file_paths.xml"

          if ! grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$MANIFEST"
          fi

          # Authority ApkInstallerPlugin.java references directly
          # (getPackageName() + ".apkinstaller.fileprovider") -- must match.
          if ! grep -q 'apkinstaller.fileprovider' "$MANIFEST"; then
            sed -i 's#</application>#    <provider\n        android:name="androidx.core.content.FileProvider"\n        android:authorities="${applicationId}.apkinstaller.fileprovider"\n        android:exported="false"\n        android:grantUriPermissions="true">\n        <meta-data\n            android:name="android.support.FILE_PROVIDER_PATHS"\n            android:resource="@xml/apk_installer_file_paths" />\n    </provider>\n</application>#' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Generate app icons (shield logo)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1E3A5F' --iconBackgroundColorDark '#1E3A5F' || echo "icon generation skipped"

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/eduignite-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Configure release signing
        run: python3 scripts/patch-release-signing.py android/app/build.gradle

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/eduignite-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk eduignite-mobile.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.${{ github.run_number }}
          name: EduIgnite Mobile v1.0.${{ github.run_number }}
          files: apps/mobile/eduignite-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish the signed APK straight to the self-hosted VPS, which Caddy
      # serves at https://eduignite.online/downloads/eduignite-mobile.apk (the
      # website's download button). Replaces the old AWS S3 + SSM path.
      - name: Publish APK to the download host (VPS)
        working-directory: apps/mobile
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            eduignite-mobile.apk \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/eduignite/downloads/eduignite-mobile.apk"

      - name: Notify backend of new mobile app version
        shell: bash
        # Non-fatal: a hiccup here should never fail an otherwise-successful
        # release. Auth is a shared-secret bearer token — CI has no logged-in
        # user context (see backend/apps/platform/app_version_views.py).
        #
        # This had been silently failing on EVERY run: the URL pointed at
        # eduignite.online (the Next.js website), which does not proxy
        # /api/* through to the real backend -- it returns a redirect for
        # that path (confirmed live: fetch() against it comes back
        # `type: "opaqueredirect"`). `curl -sf` has no -L, so it never
        # follows that redirect; -f only treats 4xx/5xx as failure, so a
        # 3xx exits 0 with whatever tiny redirect body curl received --
        # this step showed as "passed" on every single run while never
        # actually reaching Django at all. Fixed to hit api.eduignite.online
        # directly, matching offline-desktop.yml/offline-companion.yml's
        # already-proven-working equivalent calls.
        continue-on-error: true
        run: |
          bytes=$(stat -c%s "eduignite-mobile.apk" 2>/dev/null || stat -f%z "eduignite-mobile.apk")
          size_mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1024 / 1024 }")
          curl -sf -X POST "https://api.eduignite.online/api/v1/platform/app-versions/mobile/" \
            -H "Authorization: Bearer ${{ secrets.CI_VERSION_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"latestVersion\":\"$NEXT_PUBLIC_APP_VERSION\",\"downloadUrl\":\"https://eduignite.online/downloads/eduignite-mobile.apk\",\"releaseNotes\":\"\",\"size\":\"${size_mb} MB\"}"
