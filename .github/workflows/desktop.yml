name: Build desktop app

# Monorepo: only rebuild the Windows installer when the desktop app (or this
# workflow) changes.
on:
  # Free GitHub plans have a monthly Actions-minutes allowance and these builds
  # are the heaviest jobs, so they no longer run on every merge. They run once a
  # week (and only when the app changed since the last published build) or on
  # demand: Actions > this workflow > "Run workflow".
  schedule:
    - cron: '0 2 * * 1'   # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NEXT_PUBLIC_API_URL: https://api.eduignite.online/api/v1
  NEXT_PUBLIC_APP_URL: https://eduignite.online
  # NEXT_PUBLIC_APP_VERSION / APP_VERSION are derived in the "Derive version"
  # step (release/version.json major.minor + run number) and exported through
  # $GITHUB_ENV. See docs/APP_RELEASES.md.

# One publish at a time per app (a queued run replaces an older queued one; the
# release notes cover everything since the last published build, so nothing is lost).
concurrency:
  group: release-desktop
  cancel-in-progress: false

# Every `run` step executes inside the desktop app package.
defaults:
  run:
    working-directory: apps/desktop

jobs:
  # Cheap gate (about 20 seconds): skip the expensive build when nothing relevant
  # changed since the build that is currently published. A manual run always builds.
  check:
    name: Anything new to release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the published build
        id: gate
        run: |
          set -u
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "manual run: building"; exit 0
          fi
          last=$(curl -fsS --max-time 20 https://eduignite.online/downloads/releases-desktop.json             | python3 -c "import sys,json; d=json.load(sys.stdin); v=d['latest']; print([r for r in d['releases'] if r['version']==v][0]['git_sha'])" 2>/dev/null || true)
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "no published build found: building"; exit 0
          fi
          if git diff --quiet "$last" HEAD -- apps/desktop release scripts/release .github/workflows/desktop.yml; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "no changes since $last: skipping"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "changes since $last: building"
          fi

  windows:
    name: Windows installer
    needs: check
    if: needs.check.outputs.build == 'true'
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes are built from the merge history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Gate: the release tooling must pass its own tests before anything is built.
      - name: Test release scripts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: node --test scripts/release/test/release.test.mjs

      - name: Derive version
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/release/derive-version.mjs --run "${{ github.run_number }}" | tee -a "$GITHUB_ENV"
          V=$(node scripts/release/derive-version.mjs --run "${{ github.run_number }}" | sed -n 's/^APP_VERSION=//p')
          echo "NEXT_PUBLIC_APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Write build-info.json (shown in the app's Settings)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: node scripts/release/build-info.mjs --app desktop --out apps/desktop/public/build-info.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # electron-builder reads the app's version to package (baked into
      # app.asar's package.json, and therefore what app.getVersion() returns
      # at runtime, and what gets written into release/latest.yml's own
      # `version` field for electron-updater to compare against) from THIS
      # package.json's own "version" field -- it has no idea
      # NEXT_PUBLIC_APP_VERSION even exists. Left unpatched, every build
      # would package itself as the static "1.0.0" forever, so
      # electron-updater (electron/autoUpdate.js) would never see an update
      # no matter how many new versions ship. Same fix already applied in
      # offline-desktop.yml for the exact same reason. Must run BEFORE
      # `npm run dist:win` below.
      - name: Set package.json version to the real release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = process.env.APP_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Next.js (standalone) + prepare
        run: npm run app:build

      - name: Package Windows installer
        run: npm run dist:win

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}
          name: EduIgnite Desktop v${{ env.APP_VERSION }}
          files: apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to the self-hosted VPS (Caddy serves /opt/eduignite/downloads at
      # https://eduignite.online/downloads/): versioned installer + sha256 +
      # latest alias (eduignite-desktop-setup.exe, the long-standing stable URL) +
      # releases-desktop.json manifest, all uploaded to a temp name and renamed
      # into place. Also refreshes the electron-updater feed at
      # downloads/updates/desktop/ (latest.yml + installer; the "/desktop/"
      # segment is load-bearing, apps/offline-desktop has its own feed).
      # Only reached when every step above succeeded.
      - name: Publish installer to the download host (VPS)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_NOTES_OUT: ${{ runner.temp }}/release-notes.txt
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          installer=$(ls apps/desktop/release/*.exe | head -n 1)
          VPS_USER="${{ vars.VPS_USER }}" VPS_HOST="${{ vars.VPS_HOST }}" \
            bash scripts/release/publish.sh desktop "$installer" apps/desktop/release/latest.yml

      - name: Notify backend of new desktop app version
        shell: bash
        # Non-fatal: a hiccup here should never fail an otherwise-successful
        # release. Auth is a shared-secret bearer token — CI has no logged-in
        # user context (see backend/apps/platform/app_version_views.py).
        #
        # This had been silently failing on EVERY run: the URL pointed at
        # eduignite.online (the Next.js website), which does not proxy
        # /api/* through to the real backend -- it returns a redirect for
        # that path (confirmed live: fetch() against it comes back
        # `type: "opaqueredirect"`). `curl -sf` has no -L, so it never
        # follows that redirect; -f only treats 4xx/5xx as failure, so a
        # 3xx exits 0 with whatever tiny redirect body curl received --
        # this step showed as "passed" on every single run while never
        # actually reaching Django at all. Fixed to hit api.eduignite.online
        # directly, matching offline-desktop.yml/offline-companion.yml's
        # already-proven-working equivalent calls.
        continue-on-error: true
        run: |
          installer=$(ls release/*.exe | head -n 1)
          bytes=$(stat -c%s "$installer" 2>/dev/null || stat -f%z "$installer")
          size_mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1024 / 1024 }")
          notes=$(head -c 1500 "${{ runner.temp }}/release-notes.txt" 2>/dev/null | tr -d '"\\' | tr '\n' ' ' || true)
          curl -sf -X POST "https://api.eduignite.online/api/v1/platform/app-versions/desktop/" \
            -H "Authorization: Bearer ${{ secrets.CI_VERSION_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"latestVersion\":\"$NEXT_PUBLIC_APP_VERSION\",\"downloadUrl\":\"https://eduignite.online/downloads/eduignite-desktop-setup.exe\",\"releaseNotes\":\"$notes\",\"size\":\"${size_mb} MB\"}"
