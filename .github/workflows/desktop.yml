name: Build desktop app

# Monorepo: only rebuild the Windows installer when the desktop app (or this
# workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NEXT_PUBLIC_API_URL: https://api.eduignite.online/api/v1
  NEXT_PUBLIC_APP_URL: https://eduignite.online
  # Baked into the build so the app can compare its own version against the
  # platform's app-versions endpoint (see src/lib/app-version.ts). Kept in
  # sync with the tag/release name below.
  NEXT_PUBLIC_APP_VERSION: 1.0.${{ github.run_number }}
  AWS_REGION: us-east-1
  DOWNLOADS_BUCKET: eduignite-prod-media-4e04d3e3
  APP_NAME_TAG: eduignite-prod-app

# Every `run` step executes inside the desktop app package.
defaults:
  run:
    working-directory: apps/desktop

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # electron-builder reads the app's version to package (baked into
      # app.asar's package.json, and therefore what app.getVersion() returns
      # at runtime, and what gets written into release/latest.yml's own
      # `version` field for electron-updater to compare against) from THIS
      # package.json's own "version" field -- it has no idea
      # NEXT_PUBLIC_APP_VERSION even exists. Left unpatched, every build
      # would package itself as the static "1.0.0" forever, so
      # electron-updater (electron/autoUpdate.js) would never see an update
      # no matter how many new versions ship. Same fix already applied in
      # offline-desktop.yml for the exact same reason. Must run BEFORE
      # `npm run dist:win` below.
      - name: Set package.json version to the real release version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '${{ env.NEXT_PUBLIC_APP_VERSION }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build Next.js (standalone) + prepare
        run: npm run app:build

      - name: Package Windows installer
        run: npm run dist:win

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: EduIgnite Desktop v1.0.${{ github.run_number }}
          files: apps/desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Confirmed live in production this had never actually run: every CI
      # build "succeeded" and created a real (but unreachable -- this repo
      # is private) GitHub Release, while the site kept serving a static
      # EduIgnite-Setup-1.0.0.exe uploaded once, long ago, by hand -- real
      # users have never received a single one of these builds. Mirrors
      # mobile.yml's already-working "Publish APK to the download host"
      # step exactly, adapted for the Windows installer.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish installer to the download host (S3 + box sync)
        shell: bash
        working-directory: apps/desktop
        run: |
          installer=$(ls release/*.exe | head -n 1)
          aws s3 cp "$installer" "s3://$DOWNLOADS_BUCKET/downloads/eduignite-desktop-setup.exe" --region "$AWS_REGION"
          # In-app auto-update feed (electron-updater's `generic` provider --
          # see electron-builder.yml's `publish` block and electron/autoUpdate.js).
          # Published under a separate downloads/updates/desktop/ prefix,
          # alongside (not instead of) the unversioned upload above, which
          # keeps powering the website's "download EduIgnite" button
          # unchanged. latest.yml's own `path`/`files[].url` is just the bare
          # filename, so it must sit next to the versioned installer at this
          # same prefix for electron-updater to resolve the download URL
          # correctly.
          #
          # The "/desktop/" segment is load-bearing: apps/offline-desktop
          # publishes its OWN latest.yml for a different application to this
          # same host. Both apps originally published straight to
          # downloads/updates/latest.yml with no per-app segment -- confirmed
          # live that this was a real collision (whichever app deployed most
          # recently silently overwrote the other's feed file), which would
          # have made the OTHER app's electron-updater try to download and
          # install a completely different EduIgnite application.
          aws s3 cp "$installer" "s3://$DOWNLOADS_BUCKET/downloads/updates/desktop/$(basename "$installer")" --region "$AWS_REGION"
          aws s3 cp "release/latest.yml" "s3://$DOWNLOADS_BUCKET/downloads/updates/desktop/latest.yml" --region "$AWS_REGION"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$APP_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Syncing installers on $INSTANCE_ID"
          # --exact-timestamps: plain `aws s3 sync` skips a same-size
          # destination file that isn't verifiably newer by timestamp alone
          # -- latest.yml stays the same handful of bytes release to
          # release, which silently stranded a stale offline-desktop
          # latest.yml on the box for a full release cycle before this flag
          # was added there. Applied here proactively for the same reason.
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync installers" \
            --parameters commands="aws s3 sync s3://$DOWNLOADS_BUCKET/downloads/ /opt/eduignite/downloads/ --exact-timestamps --region $AWS_REGION" \
            --region "$AWS_REGION"

      - name: Notify backend of new desktop app version
        shell: bash
        # Non-fatal: a hiccup here should never fail an otherwise-successful
        # release. Auth is a shared-secret bearer token — CI has no logged-in
        # user context (see backend/apps/platform/app_version_views.py).
        #
        # This had been silently failing on EVERY run: the URL pointed at
        # eduignite.online (the Next.js website), which does not proxy
        # /api/* through to the real backend -- it returns a redirect for
        # that path (confirmed live: fetch() against it comes back
        # `type: "opaqueredirect"`). `curl -sf` has no -L, so it never
        # follows that redirect; -f only treats 4xx/5xx as failure, so a
        # 3xx exits 0 with whatever tiny redirect body curl received --
        # this step showed as "passed" on every single run while never
        # actually reaching Django at all. Fixed to hit api.eduignite.online
        # directly, matching offline-desktop.yml/offline-companion.yml's
        # already-proven-working equivalent calls.
        continue-on-error: true
        run: |
          installer=$(ls release/*.exe | head -n 1)
          bytes=$(stat -c%s "$installer" 2>/dev/null || stat -f%z "$installer")
          size_mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1024 / 1024 }")
          curl -sf -X POST "https://api.eduignite.online/api/v1/platform/app-versions/desktop/" \
            -H "Authorization: Bearer ${{ secrets.CI_VERSION_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"latestVersion\":\"$NEXT_PUBLIC_APP_VERSION\",\"downloadUrl\":\"https://eduignite.online/downloads/eduignite-desktop-setup.exe\",\"releaseNotes\":\"\",\"size\":\"${size_mb} MB\"}"
