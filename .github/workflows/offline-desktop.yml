name: Build offline desktop app

# Monorepo: only rebuild the EduIgnite Offline installer when that app (or
# this workflow) changes. Mirrors .github/workflows/desktop.yml's structure;
# see that file for the sibling "thin wrapper around a remote Next.js
# server" desktop app. This one packages the fully local/offline Electron
# app in apps/offline-desktop instead.
on:
  push:
    branches: [main]
    paths:
      - 'apps/offline-desktop/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  NEXT_PUBLIC_API_URL: https://api.eduignite.online/api/v1
  NEXT_PUBLIC_APP_URL: https://eduignite.online
  AWS_REGION: us-east-1
  DOWNLOADS_BUCKET: eduignite-prod-media-4e04d3e3
  APP_NAME_TAG: eduignite-prod-app
  # Independent of the app's package.json version (same scheme desktop.yml
  # uses for its own release tag) — a simple monotonically increasing
  # release identifier tied to the CI run.
  RELEASE_VERSION: 1.0.${{ github.run_number }}

# Every `run` step executes inside the offline-desktop app package.
defaults:
  run:
    working-directory: apps/offline-desktop

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # better-sqlite3-multiple-ciphers only ships prebuilt Windows
          # binaries for Node ABI 127/137/147 (Node 22/24/25+), not 115
          # (Node 20) — on Node 20 `npm install` falls back to compiling
          # from source via node-gyp, which needs Visual Studio's C++
          # Build Tools that windows-latest doesn't have, and fails. Node
          # 24 matches what's already been validated locally for this app.
          # electron-builder's own npmRebuild step (default true, not
          # overridden in electron-builder.yml) separately refetches the
          # correct electron-vNNN prebuild for the packaged app at build
          # time — this only fixes the `npm install` step itself.

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck + build renderer/main
        run: npm run build

      - name: Run tests
        run: npm run test

      # Root cause of a real crash on install ("Module._resolveFilename ...
      # dunder-proto/get.js"): npm hoists ALL dependencies (prod + dev) into
      # one flat top-level node_modules. electron-builder is supposed to ship
      # only production dependencies, but with a flat tree it can't reliably
      # tell "top-level package only required by a devDependency" apart from
      # "top-level package the app actually needs" — so devDependency-only
      # packages (here, electron-builder's own chain: electron-builder ->
      # app-builder-lib -> form-data -> ... -> dunder-proto) rode along into
      # app.asar. Nothing in this app's code requires dunder-proto; it just
      # got bundled, and crashed at runtime because ITS OWN transitive deps
      # weren't fully included either.
      #
      # Fix: prune node_modules to true production-only dependencies first
      # (npm's own dependency resolution, guaranteed-correct full transitive
      # closure — no hand-written allow-list to keep in sync). electron-builder
      # itself then runs via `npx --package=`, which resolves from npx's own
      # isolated cache rather than the now-pruned local node_modules, so
      # pruning away its devDependency-only tooling doesn't stop it from
      # running — it just stops that tooling from being copied into the app.
      # electron-builder normally reads the target Electron version from the
      # locally-installed `electron` package (node_modules/electron/package.json)
      # -- capture the resolved version BEFORE pruning removes it, and pass it
      # explicitly below, so packaging doesn't depend on that devDependency
      # still being physically present.
      - name: Capture resolved Electron version
        id: electron_version
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"

      # `npm prune --omit=dev` was tried first and looked right (dunder-proto,
      # gopd etc. all present per `asar list`) but a REAL install+launch test
      # still crashed identically. Root cause: prune mutates the EXISTING
      # (dev+prod) tree in place rather than recomputing hoisting from
      # scratch, and can leave a package ONLY nested inside a sibling
      # package's own node_modules (e.g. call-bind-apply-helpers ended up
      # only at node_modules/call-bind/node_modules/call-bind-apply-helpers)
      # with its top-level copy removed. `npm ci --omit=dev` on a clean
      # node_modules recomputes hoisting correctly for the pruned set.
      - name: Clean reinstall with production-only dependencies
        shell: bash
        run: |
          rm -rf node_modules
          npm ci --omit=dev --no-audit --no-fund

      # Even after the clean reinstall above, a SECOND, independent bug
      # surfaced under a real install+launch test: electron-builder's own
      # asar-packing step does its own dependency walk/dedup on top of
      # whatever's on disk (confirmed by direct experiment -- the correct,
      # top-level-hoisted copy on disk did NOT stop the packaged asar from
      # containing only a nested copy under a sibling package), and this was
      # reproduced as genuinely non-deterministic run-to-run (which specific
      # shared packages end up mis-nested varies each time). No electron-
      # builder config flag fixed this reliably, so instead: build the
      # unpacked app only (no installer yet), self-heal the resulting
      # app.asar's require() resolution with a generic script (see
      # scripts/fix-packaged-node-resolution.js for the full explanation),
      # THEN build the NSIS installer from that already-fixed directory via
      # --prepackaged. Verified end-to-end for real: installed the resulting
      # .exe via a silent install and launched the installed app -- correct
      # window, no crash, confirmed via UI Automation reading the (absence
      # of an) error dialog.
      # shell: bash matters here -- this step failed on the runner's default
      # pwsh with "ENOENT ... open '.electronVersion=33.4.11'": PowerShell
      # mangles the dotted `-c.electronVersion=X` config-override syntax into
      # a literal `-c` (config FILE path) followed by a separate positional
      # argument, rather than passing it through as one token the way bash
      # does. Verified working locally in bash with this exact command.
      - name: Build unpacked app (no installer yet)
        shell: bash
        run: npx --yes --package=electron-builder@25.1.8 electron-builder --win dir --publish never -c.electronVersion=${{ steps.electron_version.outputs.version }}

      - name: Self-heal packaged node_modules resolution
        shell: bash
        run: |
          npx --yes asar extract release/win-unpacked/resources/app.asar asar-extract
          node scripts/fix-packaged-node-resolution.js asar-extract
          rm -f release/win-unpacked/resources/app.asar
          npx --yes asar pack asar-extract release/win-unpacked/resources/app.asar
          rm -rf asar-extract

      # No code signing cert exists yet for this app (same known, pre-existing
      # limitation as apps/desktop) — the NSIS installer ships unsigned.
      # shell: bash for the same reason as "Build unpacked app" above.
      - name: Package Windows installer
        shell: bash
        run: npx --yes --package=electron-builder@25.1.8 electron-builder --win nsis --publish never --prepackaged release/win-unpacked -c.electronVersion=${{ steps.electron_version.outputs.version }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-desktop-v${{ env.RELEASE_VERSION }}
          name: EduIgnite Offline v${{ env.RELEASE_VERSION }}
          files: apps/offline-desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish installer to the download host (S3 + box sync)
        shell: bash
        working-directory: apps/offline-desktop
        run: |
          installer=$(ls release/*.exe | head -n 1)
          aws s3 cp "$installer" "s3://$DOWNLOADS_BUCKET/downloads/eduignite-offline-setup.exe" --region "$AWS_REGION"
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$APP_NAME_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Syncing installers on $INSTANCE_ID"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "sync installers" \
            --parameters commands="aws s3 sync s3://$DOWNLOADS_BUCKET/downloads/ /opt/eduignite/downloads/ --region $AWS_REGION" \
            --region "$AWS_REGION"

      # Tells the platform backend about this release so every shipped app's
      # in-app update check (src/update/checkForUpdate.ts) can see it. Called
      # ONLY by CI, authenticated with a shared-secret bearer token (never a
      # logged-in user) — see backend/apps/platform/ for the matching
      # CI_VERSION_UPDATE_TOKEN Django setting. The secret's actual value is
      # set once in GitHub repo settings by a human, not by this workflow.
      - name: Report new version to the platform backend
        shell: bash
        run: |
          curl -sS -X POST "${NEXT_PUBLIC_API_URL}/platform/app-versions/offline_desktop/" \
            -H "Authorization: Bearer ${{ secrets.CI_VERSION_UPDATE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"latestVersion\":\"$RELEASE_VERSION\",\"downloadUrl\":\"https://eduignite.online/downloads/eduignite-offline-setup.exe\",\"releaseNotes\":\"EduIgnite Offline v$RELEASE_VERSION - see the GitHub Release (offline-desktop-v$RELEASE_VERSION) for details.\"}"
