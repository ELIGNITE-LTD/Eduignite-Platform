name: Deploy frontend (VPS)

# Auto-deploy the Next.js website to the self-hosted Contabo VPS on every push
# to main that touches website code. The image is built on the server from the
# synced source (public env vars are baked in via docker-compose build args),
# then served by `next start` on :3000 behind Caddy.
#
# Required repo config (Settings > Secrets and variables > Actions):
#   secret  VPS_SSH_KEY  — private key authorized on the VPS (CI deploy key)
#   var     VPS_HOST     — e.g. 169.58.48.112
#   var     VPS_USER     — e.g. root

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync website code to the VPS
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='tsconfig.tsbuildinfo' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            apps/website/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/opt/eduignite/frontend/"

      - name: Rebuild & restart the frontend
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'bash /opt/eduignite/deploy-frontend.sh'
